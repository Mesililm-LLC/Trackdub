version: 1

scope:
  include: []
  exclude:
    - "bin/**"
    - "obj/**"
    - "resources/olive-recipes/**"
    - ".dirac-cache/**"
    - ".playwright-mcp/**"
    - "assets/demo-media/**"

repowiki:
  template: ""
  notes:
    - text: >-
        Trackdub is the PUBLIC, Apache-2.0 core (MesilimLLC/Trackdub): a
        cross-platform, local-first AI dubbing engine, SDK, CLI, and pipeline.
        All inference runs locally via ONNX models with no mandatory cloud
        dependency. The private desktop product (Trackdub-gated) consumes this
        repo as a read-only git submodule pinned to an immutable core commit.
    - text: >-
        Enforce the strict layered dependency direction; Domain depends on
        nothing. Application -> Contracts, Domain, Licensing; Infrastructure ->
        Application, Contracts, Domain; Inference.Onnx -> Inference, Contracts,
        Domain; Composition is the DI wiring root; Sdk -> Application,
        Composition, Licensing; Cli -> Sdk. Never describe inference code
        leaking upward into Domain.
    - text: >-
        Model governance: only ONNX models with verified commercial licenses
        ship. The bundled manifest at
        src/Trackdub.Inference/Runtime/ModelManifest/bundled-models.manifest.json
        is the single source of truth for model inventory. Unknown license =
        unsafe. Provider registered != model downloaded != stage ran != stage
        succeeded; treat these as distinct states.
    - text: >-
        The pipeline is language detection -> ASR -> translation -> TTS -> audio
        export. Pipeline stages are user-triggered and use immutable execution
        snapshots with prerequisite contracts; original artifacts are preserved
        on skip/fail with exact skip reasons logged.
    - text: >-
        Build/test uses .NET 10 (10.0.300+) with central package management
        (Directory.Packages.props; never add Version in .csproj), package lock
        files, Nullable/TreatWarningsAsErrors/ImplicitUsings enabled, and the
        -m:1 flag for restore/build/test. FFmpeg is required for media stages;
        libmpv/LibVLC are optional playback natives.
    - text: >-
        Layering contract for generated docs. The knowledge cards under
        .qoder/repowiki/knowledge/ are the canonical, auto-refreshing source of
        truth for code-level facts and must stay current with the code. The
        prose pages under .qoder/repowiki/en/content/ are secondary per-repo
        detail and must not contradict the cards. The separate Trackdub.wiki
        repo (published as the GitHub wiki) is a manually regenerated,
        cross-repo product amalgam built FROM these cards plus Devin/Cubic
        sources; it is downstream, not a source to copy. Do not duplicate the
        cross-repo product narrative here — keep this repo's prose code-focused
        and defer product-level overview to the wiki.

knowledgecard:
  notes:
    - text: >-
        Split knowledge cards along the project boundaries in src/: Domain,
        Contracts, Application, Infrastructure, Media, Media.Playback,
        Inference, Inference.Onnx, Composition, Sdk, Cli, Licensing, Tools,
        Analyzers, Benchmarks, DubBench, OnnxRuntime.Dnnl.Native. Keep the
        dependency direction explicit in each card's relationships.
    - text: >-
        Tests live under tests/ as Trackdub.<Area>.Tests (xUnit). Domain tests
        are pure/no I/O; Application tests use fakes from
        tests/Trackdub.TestDoubles/; architecture tests enforce dependency
        direction. Note which test project covers each module.
