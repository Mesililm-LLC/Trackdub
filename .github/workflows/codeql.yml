name: CodeQL Advanced

on:
  push:
    branches: [main]
  # Every pull request, not only the ones targeting main. A stacked pull request (base = another
  # branch) is still merged code, but with the branch filter above in place its analysis only ran
  # after the change landed on main. Pull requests into main are unaffected; the concurrency group
  # below already keys on the pull request number.
  pull_request:
  schedule:
    - cron: "42 1 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: csharp
            build-mode: manual
            runner: windows-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended,security-and-quality

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            NuGet.config

      - name: Build .NET solution
        if: matrix.language == 'csharp'
        shell: pwsh
        run: |
          dotnet restore Trackdub.slnx -m:1
          dotnet build Trackdub.slnx -c Release -m:1 --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
