<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1171 963">
  <defs>
    <!-- Primary vibrant multi-stop gradients -->
    <linearGradient id="crimsonGrad" x1="250" y1="48" x2="620" y2="953" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF3868"/>
      <stop offset="0.18" stop-color="#E61947"/>
      <stop offset="0.50" stop-color="#B80A31"/>
      <stop offset="0.82" stop-color="#7D041F"/>
      <stop offset="1" stop-color="#4D0112"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="480" y1="290" x2="920" y2="953" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD466"/>
      <stop offset="0.22" stop-color="#FFAD33"/>
      <stop offset="0.55" stop-color="#F5800A"/>
      <stop offset="0.82" stop-color="#C95300"/>
      <stop offset="1" stop-color="#8F3300"/>
    </linearGradient>

    <!-- Soft chromatic top-lighting (prevents chalky white washout) -->
    <linearGradient id="tTopGlow" x1="0" y1="8" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB5C8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFB5C8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="dTopGlow" x1="0" y1="290" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </linearGradient>

    <!-- Smooth cast shadow filter from 'T' stem onto 'D' -->
    <filter id="tCastShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>

    <!-- Master Geometry (Unified -12.85 deg slant & G2-continuous curves) -->
    <path id="dShape" fill-rule="evenodd" d="M 480 290 L 840 290 C 1014 290 1138 422 1138 618 C 1138 814 1004 953 814 953 L 280 953 L 480 290 Z M 634 442 L 764 442 C 872 442 946 512 946 615 C 946 718 866 788 748 788 L 560 788 C 545 788 538 778 542 762 L 610 464 C 614 449 622 442 634 442 Z"/>

    <path id="tShape" d="M 308 48 L 1014 48 C 1070 48 1118 35 1156 8 C 1152 106 1125 184 1072 224 C 1030 256 978 264 912 264 L 570 264 C 549 264 538 273 534 290 L 404 859 C 391 916 360 953 298 953 L 190 953 C 172 953 165 942 170 922 L 315 287 C 319 271 311 264 294 264 L 256 264 C 144 264 56 336 14 410 C 8 320 24 236 68 172 C 120 96 206 48 308 48 Z"/>

    <clipPath id="dClip">
      <use href="#dShape"/>
    </clipPath>
  </defs>

  <!-- 1. Orange 'D' Base & Chromatic Top Sheen -->
  <use href="#dShape" fill="url(#orangeGrad)"/>
  <use href="#dShape" fill="url(#dTopGlow)"/>

  <!-- Cast Shadow from 'T' onto 'D' -->
  <g clip-path="url(#dClip)">
    <use href="#tShape" fill="#3D0E00" fill-opacity="0.45" transform="translate(16, 4)" filter="url(#tCastShadow)"/>
  </g>

  <!-- 2. Crimson 'T' Base & Chromatic Top Sheen -->
  <use href="#tShape" fill="url(#crimsonGrad)"/>
  <use href="#tShape" fill="url(#tTopGlow)"/>
</svg>