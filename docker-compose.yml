services:
  trackdub:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      TRACKDUB_DATA_ROOT: /data
      AUTO_DOWNLOAD_MODELS: "${AUTO_DOWNLOAD_MODELS:-false}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      ONNX_PROVIDER: cuda
      TRACKDUB_ACCEPT_NVIDIA_TENSORRT_RTX_LICENSE: "${TRACKDUB_ACCEPT_NVIDIA_TENSORRT_RTX_LICENSE:-}"
    gpus: all
    init: true
    restart: on-failure:5
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_swappiness: 0
    volumes:
      - trackdub-data:/data
      - ./docker/input:/work/input
      - ./docker/output:/work/output
      - trackdub-logs:/data/logs
      - trackdub-linml:/home/trackdub/.local/linml-deps
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "dotnet", "Trackdub.Cli.dll", "--model-directory", "/data/models", "doctor", "--json"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

volumes:
  trackdub-data:
  trackdub-logs:
  trackdub-linml:
